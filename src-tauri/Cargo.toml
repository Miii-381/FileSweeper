[package]
name = "video-sweeper"
version = "0.1.0"
description = "A local video management application"
authors = ["Ayanami"]
edition = "2021"

[build-dependencies]
# Tauri's build script generates desktop permissions and Windows resource metadata.
tauri-build = { version = "2", features = [] }

[dependencies]
# Native plugins remain in Rust; the front end only imports APIs when it needs to call them.
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["net", "rt"] }
windows = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
