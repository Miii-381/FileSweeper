[package]
name = "file-sweeper"
version = "1.3.2"
description = "A local file management application"
authors = ["Ayanami"]
license = "MIT"
edition = "2021"

[build-dependencies]
# Tauri's build script generates desktop permissions and Windows resource metadata.
tauri-build = { version = "2", features = [] }

[dependencies]
# Native plugins remain in Rust; the front end only imports APIs when it needs to call them.
axum = "0.8"
async-stream = "0.3"
base64 = "0.22"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp", "bmp", "ico", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
lofty = "0.24.0"
notify = "8"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { version = "1", features = ["io-util", "net", "process", "rt"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61"
