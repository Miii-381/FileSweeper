name: quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm ci
      - name: Prepare sidecar placeholders for compile checks
        shell: pwsh
        run: |
          New-Item sidecars/ffmpeg-x86_64-pc-windows-msvc.exe -ItemType File -Force
          New-Item sidecars/ffprobe-x86_64-pc-windows-msvc.exe -ItemType File -Force
          New-Item sidecars/ffmpegthumbnailer-x86_64-pc-windows-msvc.exe -ItemType File -Force
      - name: Run project quality gate
        run: npm run check
